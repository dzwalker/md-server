services:
  md-server:
    build: .
    container_name: md-server
    restart: unless-stopped
    environment:
      - MD_PORT=3001
      # set 里的目录名都相对于该父目录
      - MD_BASE_DIR=/data/docs
    ports:
      - "3001:3001"
      # MCP SSE 端口（如需对外暴露再取消注释）
      # - "3002:3002"
    volumes:
      # 把本地文档父目录挂到 /data/docs（与 MD_BASE_DIR 对应）
      - ./data:/data/docs
      # 空间 set 配置（热加载，可用 UI 管理）
      - ./sets.json:/app/sets.json
      - md_hf_cache:/root/.cache/huggingface
      - md_index:/data/index

volumes:
  md_hf_cache:
  md_index:
